<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Direction Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        header {
            background: #222;
            color: white;
            padding: 20px 0;
            font-size: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .grid-item {
            background: #ddd;
            padding: 20px;
            text-align: center;
        }
        footer {
            background: #222;
            color: white;
            padding: 10px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        Art Direction Portfolio
    </header>
    <div class="container">
        <h2>Projecten</h2>
        <div class="grid">
            <div class="grid-item">Project 1</div>
            <div class="grid-item">Project 2</div>
            <div class="grid-item">Project 3</div>
            <div class="grid-item">Project 4</div>
        </div>
    </div>
    <footer>
        &copy; 2025 Art Direction Portfolio
    </footer>
</body>
</html>
